openapi: 3.0.3
info:
  title: CitationalAI API
  version: 0.1.0
  description: >
    Data layer for the Free & Essential merchant dashboards and the public
    league tables. Matches the implemented routes in src/api/ — not a
    forward-looking spec, this describes what's actually running.


    AUTH STATUS: authentication is currently STUBBED (see
    src/api/middleware/authStub.js). Every /brands/* and /categories/*
    request is accepted without verifying the caller is authorized for the
    requested brand — fine for building/testing UI against Phase 1 pool
    data, NOT safe for a public deployment. Real Shopify session-token auth
    is a documented Phase 2 dependency (requires the OAuth install flow,
    not yet built). /categories/*/leaderboard is intentionally public by
    design, independent of that work.


    RESOLVED (was flagged as a known gap in the prior revision): the
    underlying mentions structure supports a brand naming MULTIPLE
    specific products in one answer (products: [{name, quote}] per
    mention — see the Mention/Product schemas). QueryResultSummary
    (used by /brands/{brand}/gaps and /categories/{category}/questions)
    now returns the full mentions structure directly, replacing the
    earlier flat recommended_brands/cited_brands string lists, which had
    no way to carry per-product detail.
  contact:
    name: Steve Brown
    email: steve@citational.ai
servers:
  - url: https://citational-api-production.up.railway.app
    description: Production (Railway) — confirmed live via /health
  - url: http://localhost:3000
    description: Local dev

tags:
  - name: brands
    description: Brand-scoped, merchant-facing endpoints (auth stubbed — see info.description)
  - name: categories
    description: Category-scoped endpoints (leaderboard is public; questions uses the same auth stub as brands for now)
  - name: webhooks
    description: Shopify GDPR compliance webhooks — HMAC-verified

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /brands/{brand}/inclusion:
    get:
      tags: [brands]
      summary: Per-channel recommended/cited counts for a brand in a category
      description: >
        Powers the dashboard headline ("is my brand recommended"). The
        total_questions_checked denominator includes queries where the
        brand had ZERO mentions — a real, valid outcome, not excluded the
        way a naive query against the brand_mentions view would (see
        routes/brands.js comment for why).
      parameters:
        - $ref: '#/components/parameters/brandPath'
        - $ref: '#/components/parameters/categoryQueryRequired'
        - name: channel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: Inclusion data
          content:
            application/json:
              schema:
                type: object
                properties:
                  category_slug:
                    type: string
                    example: skincare-beauty
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        channel:
                          $ref: '#/components/schemas/Channel'
                        recommended_count:
                          type: integer
                          example: 4
                        cited_count:
                          type: integer
                          example: 2
                        total_questions_checked:
                          type: integer
                          example: 20
        '400':
          $ref: '#/components/responses/MissingCategory'

  /brands/{brand}/competitors:
    get:
      tags: [brands]
      summary: Competitor rollup — "who's beating you"
      description: >
        Only includes competitor mentions from queries where the requested
        brand was NOT itself the recommended answer — a query the merchant
        already won doesn't surface a competitor list. limit defaults to
        10 (Free's summary card); pass a higher limit/offset for
        Essential's uncapped "By Competition" tab with drill-down.


        One row per brand, not per (brand, mention_type) — real feedback
        caught an earlier revision returning two separate rows for a
        competitor with both recommended and cited mentions, the same
        flattening pattern as the original brand_mentions grouping. Merged
        server-side, per the project's own principle that derived/
        aggregate values shouldn't be left as a client-side grouping step.
        The two-tone competitor bar (teal = recommended, navy = cited)
        needs exactly this shape.


        The merchant's OWN row is included in this same ranked list,
        tagged is_brand: true, computed with its own UNGATED tally (every
        appearance counts — unlike competitor rows, which only include
        queries the merchant didn't already win). This lets "the
        merchant's own leaderboard, ranked alongside competitors" actually
        render — a competitor-only rollup can't. The own row is always
        present regardless of page, since the merchant needs to find
        themselves ranked correctly even if that's off the current page —
        this requires fetching, merging, and sorting the full competitor
        set server-side before paginating (fine at Phase 1 volume; worth
        SQL-side pagination via a window function if this grows large).


        total_competitors deliberately does NOT include the brand's own
        row — "rank of N" means N competitors, not N-1 after counting
        yourself.
      parameters:
        - $ref: '#/components/parameters/brandPath'
        - $ref: '#/components/parameters/categoryQueryRequired'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Competitor rollup, one row per brand, with true total count
          content:
            application/json:
              schema:
                type: object
                properties:
                  category_slug:
                    type: string
                  total_competitors:
                    type: integer
                    example: 14
                  competitors:
                    type: array
                    items:
                      type: object
                      properties:
                        brand:
                          type: string
                          example: AcmeGlow
                        recommended:
                          type: integer
                          example: 5
                        cited:
                          type: integer
                          example: 3
                        total:
                          type: integer
                          example: 8
                        is_brand:
                          type: boolean
                          description: True for the merchant's own row, ranked in the same list as competitors.
                          example: false
        '400':
          $ref: '#/components/responses/MissingCategory'

  /brands/{brand}/gaps:
    get:
      tags: [brands]
      summary: Questions where this brand doesn't appear at all
      parameters:
        - $ref: '#/components/parameters/brandPath'
        - $ref: '#/components/parameters/categoryQueryRequired'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Gap list, ordered by real search volume
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/QueryResultSummary'
                        - type: object
                          properties:
                            search_volume:
                              type: integer
                              nullable: true
                              example: 2900
        '400':
          $ref: '#/components/responses/MissingCategory'

  /brands/{brand}/opportunities:
    get:
      tags: [brands]
      summary: Cross-category ranked opportunity list (both lenses)
      description: >
        Added after real feedback: no endpoint existed for the
        Opportunities page, which was explicitly designed to rank
        opportunities across ALL categories together, not one category at
        a time. Combines two lenses in one ranked list: "gap" (brand not
        mentioned at all) and "generic_win" (brand recommended, but no
        specific product named — servable now that v4 makes products an
        explicit array). Ranked by real search volume across both lenses
        together, not gaps-then-wins.


        total_gaps/total_generic_wins reflect the TRUE total count for
        each type, independent of limit/offset — added after real feedback
        caught that tab labels like "Full gaps (6)" need this explicitly;
        counting results.length client-side breaks the moment real data
        volume exceeds one page. Confirmed correct under pagination: with
        limit=1, results contains 1 item but the totals still reflect the
        full count.


        Honest scaling note: these totals run the same underlying query
        with no limit — fine at Phase 1's ~60 seeded questions, worth
        revisiting (e.g. an approximate/cached count) if volume grows by
        orders of magnitude, since an exact COUNT(*) over the full unioned
        query on every request isn't free at real scale.
      parameters:
        - $ref: '#/components/parameters/brandPath'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Ranked opportunity list, cross-category, with true totals per type
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_gaps:
                    type: integer
                    example: 6
                  total_generic_wins:
                    type: integer
                    example: 2
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        query_text:
                          type: string
                        category_slug:
                          type: string
                          example: skincare-beauty
                        channel:
                          $ref: '#/components/schemas/Channel'
                        search_volume:
                          type: integer
                          nullable: true
                          example: 6600
                        opportunity_type:
                          type: string
                          enum: [gap, generic_win]

  /categories/{category}/leaderboard:
    get:
      tags: [categories]
      summary: Top 5 brands by recommendation count (public — no auth)
      parameters:
        - $ref: '#/components/parameters/categoryPath'
      responses:
        '200':
          description: League table, top 5 only
          content:
            application/json:
              schema:
                type: object
                properties:
                  category_slug:
                    type: string
                  leaderboard:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      properties:
                        brand:
                          type: string
                          example: NimbusSkin
                        recommendations:
                          type: integer
                          example: 14

  /categories/{category}/questions:
    get:
      tags: [categories]
      summary: Full question list for a category, with latest results
      parameters:
        - $ref: '#/components/parameters/categoryPath'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Question list, ordered by real search volume
          content:
            application/json:
              schema:
                type: object
                properties:
                  category_slug:
                    type: string
                  results:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/QueryResultSummary'
                        - type: object
                          properties:
                            search_volume:
                              type: integer
                              nullable: true
                              example: 2900

  /webhooks/customers/data_request:
    post:
      tags: [webhooks]
      summary: Shopify GDPR — customer data request (near-no-op)
      description: >
        CitationalAI holds no customer/order-scoped data, so this only
        acknowledges and logs. Requires HMAC verification like all Shopify
        webhooks.
      security:
        - shopifyHmac: []
      responses:
        '200':
          description: Acknowledged
        '401':
          description: Invalid HMAC signature

  /webhooks/customers/redact:
    post:
      tags: [webhooks]
      summary: Shopify GDPR — customer redact (near-no-op)
      security:
        - shopifyHmac: []
      responses:
        '200':
          description: Acknowledged
        '401':
          description: Invalid HMAC signature

  /webhooks/shop/redact:
    post:
      tags: [webhooks]
      summary: Shopify GDPR — shop redact (real deletion logic)
      description: >
        Fires 48 hours after uninstall. Deletes the shop row; on-delete-
        cascade foreign keys handle scans/subscriptions. 30-day deadline to
        act from receipt.
      security:
        - shopifyHmac: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shop_id:
                  type: integer
                shop_domain:
                  type: string
                  example: example.myshopify.com
      responses:
        '200':
          description: Deleted
        '401':
          description: Invalid HMAC signature
        '500':
          description: Deletion failed

components:
  securitySchemes:
    shopifyHmac:
      type: apiKey
      in: header
      name: X-Shopify-Hmac-Sha256
      description: HMAC-SHA256 signature of the raw request body, base64-encoded, using the app's client secret.

  parameters:
    brandPath:
      name: brand
      in: path
      required: true
      schema:
        type: string
      example: NimbusSkin
    categoryPath:
      name: category
      in: path
      required: true
      schema:
        type: string
      example: skincare-beauty
    categoryQueryRequired:
      name: category
      in: query
      required: true
      schema:
        type: string
      example: skincare-beauty
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0

  schemas:
    Channel:
      type: string
      enum: [chatgpt, google_ai_mode, perplexity]
    MentionType:
      type: string
      enum: [recommended, cited]
    QueryResultSummary:
      type: object
      description: >
        Real feedback replaced the earlier recommended_brands/cited_brands
        flat string lists with the full mentions structure — the previous
        shape had no way to carry per-product detail even though the
        underlying data supported it since v4.
      properties:
        query_text:
          type: string
          example: best moisturiser for sensitive skin
        channel:
          $ref: '#/components/schemas/Channel'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Mention'
    Mention:
      type: object
      properties:
        brand:
          type: string
          example: AcmeGlow
        mention_type:
          $ref: '#/components/schemas/MentionType'
        products:
          type: array
          description: Empty when the brand is named generically, with no specific product.
          items:
            $ref: '#/components/schemas/Product'
    Product:
      type: object
      description: >
        One SPECIFIC named product from a brand mention. A single mention
        can list several — e.g. one answer naming both a brand's
        "Moisturising Lotion" and "SA Lotion" for different skin needs.
      properties:
        name:
          type: string
          example: SA Lotion
        quote:
          type: string
          nullable: true
          example: for very rough or bumpy skin, NimbusSkin SA Lotion adds gentle exfoliation

  responses:
    MissingCategory:
      description: category query param is required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: category is required
